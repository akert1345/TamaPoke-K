name: TamaPoke ESP32-S3 Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install board core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "GFX Library for Arduino@1.6.9" "SensorLib@0.5.2" "XPowersLib@0.3.3" "U8g2@2.36.19"
      - name: Compile firmware
        run: |
          python3 tools/verify_local_includes.py
          mkdir -p /tmp/sketch/TamaPoke /tmp/tamapoke-build
          cp ./*.ino ./*.cpp ./*.h ./*.inc /tmp/sketch/TamaPoke/
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB' --output-dir /tmp/tamapoke-build /tmp/sketch/TamaPoke
          cp /tmp/tamapoke-build/TamaPoke.ino.bin site/app.bin
          cp PMDCOLLAB_CREDITS.txt site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
